<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Charlie & The Chocolate Factory - ESL Game</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(45, 17, 44, 0.65)',
                        glassGold: 'rgba(255, 246, 214, 0.85)',
                    }
                }
            }
        }
    </script>

    <!-- Three.js & Confetti -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1b091c 0%, #3b0764 50%, #170518 100%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }

        .glass-panel {
            background: rgba(45, 17, 44, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-gold {
            background: linear-gradient(135deg, rgba(255, 246, 214, 0.85), rgba(255, 217, 125, 0.85));
            border: 1px solid #FFD700;
            color: #1b091c;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .anim-float:hover {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        }

        .correct-pulse {
            animation: pulse-green 1.5s infinite;
            border-color: #22c55e !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }

        /* Prevent Selection but allow in inputs */
        .no-select { user-select: none; -webkit-user-select: none; }
        input, textarea, select { user-select: auto; -webkit-user-select: auto; color: #1b091c; }
        
        .word-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-width: 400px;
            margin: 0 auto;
        }

        .grid-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            touch-action: none;
        }

        .grid-cell.selected {
            background: #eab308;
            color: #1b091c;
            transform: scale(1.05) rotate(-2deg);
        }

        .grid-cell.found {
            background: #22c55e;
            color: white;
            transform: scale(1) rotate(0deg);
            cursor: default;
        }

        .drag-item {
            cursor: grab;
        }
        .drag-item:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="no-select min-h-screen flex flex-col font-sans">

    <!-- 3D Background Canvas -->
    <div id="three-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-40"></div>

    <!-- Main Content Wrapper -->
    <div class="relative z-10 flex-grow flex flex-col">
        
        <!-- Header -->
        <header class="glass-panel w-full p-4 flex justify-between items-center sticky top-0 z-40 hidden" id="main-header">
            <div class="flex items-center gap-4">
                <div class="text-3xl" id="ui-avatar">🍫</div>
                <div>
                    <h2 class="font-bold text-lg leading-tight" id="ui-name">Student Name</h2>
                    <p class="text-xs text-purple-200">Class <span id="ui-class"></span> (<span id="ui-classno"></span>)</p>
                </div>
            </div>
            
            <div class="flex flex-col items-center">
                <div class="text-2xl font-black text-yellow-400 drop-shadow-md">
                    <span id="ui-score">0</span> / 39
                </div>
                <div class="text-[10px] uppercase tracking-wider text-purple-200">Total Score</div>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden md:flex flex-col items-end text-xs text-purple-200">
                    <div class="font-bold text-white mb-1"><i class="fa-solid fa-trophy text-yellow-400"></i> Top 3</div>
                    <div id="leaderboard-list"></div>
                </div>
                <button id="btn-mute" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition" onclick="toggleMute()">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </header>

        <!-- Dashboard -->
        <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full hidden" id="dashboard">
            <h1 class="text-3xl md:text-5xl font-extrabold text-center mb-8 drop-shadow-lg">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">Charlie & The Chocolate Factory</span>
            </h1>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="mission-grid">
                <!-- Cards generated via JS -->
            </div>
        </main>

    </div>

    <!-- Registration Modal -->
    <div id="modal-register" class="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-md bg-black/40">
        <div class="glass-gold rounded-3xl p-8 w-full max-w-md transform transition-all shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-ticket text-5xl text-purple-900 mb-2 drop-shadow-md"></i>
                <h2 class="text-2xl font-bold text-black">Welcome to the Factory</h2>
                <p class="text-gray-800 text-sm mt-1">Please enter your details to begin.</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-800 mb-1">Student Name</label>
                    <input type="text" id="reg-name" class="w-full bg-black/5 border border-black/20 rounded-xl px-4 py-3 text-black placeholder-black/40 focus:outline-none focus:border-purple-600 transition" placeholder="e.g. Charlie Bucket">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold uppercase text-gray-800 mb-1">Class</label>
                        <input type="text" id="reg-class" class="w-full bg-black/5 border border-black/20 rounded-xl px-4 py-3 text-black placeholder-black/40 focus:outline-none focus:border-purple-600 transition" placeholder="e.g. 3A">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold uppercase text-gray-800 mb-1">Class No.</label>
                        <input type="number" id="reg-classno" class="w-full bg-black/5 border border-black/20 rounded-xl px-4 py-3 text-black placeholder-black/40 focus:outline-none focus:border-purple-600 transition" placeholder="1-40">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-800 mb-2">Choose Avatar</label>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="avatar-picker">
                        <button class="avatar-btn bg-black/5 rounded-xl py-2 flex flex-col items-center justify-center gap-1 border border-transparent hover:bg-black/10 focus:border-purple-600 focus:bg-purple-600/20 active" data-avatar="🍫">
                            <span class="text-2xl pointer-events-none">🍫</span>
                            <span class="text-[10px] font-bold text-gray-800 pointer-events-none">Charlie</span>
                        </button>
                        <button class="avatar-btn bg-black/5 rounded-xl py-2 flex flex-col items-center justify-center gap-1 border border-transparent hover:bg-black/10 focus:border-purple-600 focus:bg-purple-600/20" data-avatar="🎩">
                            <span class="text-2xl pointer-events-none">🎩</span>
                            <span class="text-[10px] font-bold text-gray-800 pointer-events-none">Wonka</span>
                        </button>
                        <button class="avatar-btn bg-black/5 rounded-xl py-2 flex flex-col items-center justify-center gap-1 border border-transparent hover:bg-black/10 focus:border-purple-600 focus:bg-purple-600/20" data-avatar="👑">
                            <span class="text-2xl pointer-events-none">👑</span>
                            <span class="text-[10px] font-bold text-gray-800 pointer-events-none">Veruca</span>
                        </button>
                        <button class="avatar-btn bg-black/5 rounded-xl py-2 flex flex-col items-center justify-center gap-1 border border-transparent hover:bg-black/10 focus:border-purple-600 focus:bg-purple-600/20" data-avatar="🍬">
                            <span class="text-2xl pointer-events-none">🍬</span>
                            <span class="text-[10px] font-bold text-gray-800 pointer-events-none">Violet</span>
                        </button>
                        <button class="avatar-btn bg-black/5 rounded-xl py-2 flex flex-col items-center justify-center gap-1 border border-transparent hover:bg-black/10 focus:border-purple-600 focus:bg-purple-600/20" data-avatar="🍩">
                            <span class="text-2xl pointer-events-none">🍩</span>
                            <span class="text-[10px] font-bold text-gray-800 pointer-events-none">Augustus</span>
                        </button>
                        <button class="avatar-btn bg-black/5 rounded-xl py-2 flex flex-col items-center justify-center gap-1 border border-transparent hover:bg-black/10 focus:border-purple-600 focus:bg-purple-600/20" data-avatar="📺">
                            <span class="text-2xl pointer-events-none">📺</span>
                            <span class="text-[10px] font-bold text-gray-800 pointer-events-none">Mike</span>
                        </button>
                    </div>
                </div>

                <button onclick="startGame()" class="w-full bg-gradient-to-r from-purple-800 to-purple-900 text-white font-bold text-lg rounded-xl py-3 mt-4 hover:shadow-lg hover:shadow-purple-900/30 transition transform hover:-translate-y-1">
                    Enter Factory
                </button>
            </div>
        </div>
    </div>

    <!-- Mission Modal Template -->
    <div id="modal-mission" class="fixed inset-0 z-50 flex items-center justify-center p-2 md:p-6 backdrop-blur-md bg-black/60 hidden">
        <div class="glass-panel rounded-3xl w-full max-w-4xl h-full max-h-[90vh] flex flex-col shadow-2xl relative">
            <button onclick="closeMission()" class="absolute top-4 right-4 w-10 h-10 bg-white/10 rounded-full flex items-center justify-center hover:bg-white/20 transition z-10">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="p-6 border-b border-white/10 flex items-center gap-4">
                <div class="text-4xl" id="mission-icon">🎯</div>
                <div>
                    <div id="mission-num" class="text-yellow-400 text-xs font-bold uppercase tracking-widest mb-1">Mission</div>
                    <h2 class="text-2xl font-bold" id="mission-title">Mission Title</h2>
                    <p class="text-purple-200 text-sm" id="mission-desc">Description</p>
                </div>
            </div>

            <div class="p-6 overflow-y-auto flex-grow relative" id="mission-content">
                <div id="container-m1" class="hidden"></div>
                <div id="container-m2" class="hidden"></div>
                <div id="container-m3" class="hidden"></div>
                <div id="container-m4" class="hidden"></div>
                <div id="container-m5" class="hidden"></div>
                <div id="container-m6" class="hidden"></div>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="modal-alert" class="fixed inset-0 z-[60] flex items-center justify-center p-4 backdrop-blur-sm bg-black/40 hidden">
        <div class="glass-panel rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl border border-white/20">
            <i class="fa-solid fa-circle-exclamation text-4xl text-yellow-400 mb-3"></i>
            <p id="alert-msg" class="text-white font-medium mb-5">Message</p>
            <button onclick="closeAlert()" class="px-6 py-2 bg-yellow-500 text-black font-bold rounded-full shadow hover:bg-yellow-400 active:scale-95 transition">OK</button>
        </div>
    </div>

    <script>
        /* =========================================
           STATE & CONFIG
           ========================================= */
        let state = {
            user: { name: '', class: '', classno: '', avatar: '🍫' },
            scores: { m1: 0, m2: 0, m3: 0, m4: 0, m5: 0, m6: 0 },
            completed: { m1: false, m2: false, m3: false, m4: false, m5: false, m6: false },
            rendered: { m1: false, m2: false, m3: false, m4: false, m5: false, m6: false },
            isMuted: false
        };

        const MAX_SCORES = { m1: 9, m2: 6, m3: 10, m4: 10, m5: 3, m6: 1 };
        let activeMission = null;

        const missionsData = [
            { id: 'm1', num: 'Mission 1', icon: '🎫', title: 'Golden Tickets & Verbs', desc: 'Find the ticket order and past tenses.', max: 9 },
            { id: 'm2', num: 'Mission 2', icon: '🔍', title: 'Factory Word Search', desc: 'Find 6 hidden factory words.', max: 6 },
            { id: 'm3', num: 'Mission 3', icon: '✍️', title: 'Grammar & Story', desc: 'Type the correct grammar words.', max: 10 },
            { id: 'm4', num: 'Mission 4', icon: '📖', title: 'Story Order & Vocab', desc: 'Organize the events and test vocabulary.', max: 10 },
            { id: 'm5', num: 'Mission 5', icon: '📝', title: 'My Favorite Character', desc: 'Write about a character you liked.', max: 3 },
            { id: 'm6', num: 'Mission 6', icon: '🎤', title: 'Song Corner Studio', desc: 'Read or sing the Wonka Song aloud!', max: 1 }
        ];

        /* =========================================
           AUDIO ENGINE (Web Audio API)
           ========================================= */
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol, slideFreq = null) {
            if (state.isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideFreq) {
                osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
            }
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playClick() { playTone(600, 'sine', 0.1, 0.3, 300); }
        function playHover() { playTone(800, 'sine', 0.05, 0.1); }
        function playError() { playTone(200, 'sawtooth', 0.3, 0.3, 150); }
        function playSuccess() {
            if (state.isMuted || !audioCtx) return;
            const notes = [440, 554.37, 659.25]; // A4, C#5, E5
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'triangle', 0.2, 0.3), i * 100);
            });
        }

        function toggleMute() {
            state.isMuted = !state.isMuted;
            const btn = document.getElementById('btn-mute');
            btn.innerHTML = state.isMuted ? '<i class="fa-solid fa-volume-xmark text-red-400"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            playClick();
        }

        /* =========================================
           CUSTOM ALERTS
           ========================================= */
        function showWarning(msg) {
            playError();
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('modal-alert').classList.remove('hidden');
        }

        function closeAlert() {
            playClick();
            document.getElementById('modal-alert').classList.add('hidden');
        }

        /* =========================================
           THREE.JS BACKGROUND
           ========================================= */
        function initThreeJS() {
            const container = document.getElementById('three-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Golden Ticket Geometry
            const geometry = new THREE.BoxGeometry(4, 2, 0.1);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                metalness: 0.7, 
                roughness: 0.3 
            });
            const ticket = new THREE.Mesh(geometry, material);
            
            // Positioning right side
            ticket.position.set(3, 0, -5);
            ticket.rotation.set(0.5, 0.5, 0);
            scene.add(ticket);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                ticket.rotation.y += 0.005;
                ticket.rotation.x = Math.sin(Date.now() * 0.001) * 0.2;
                ticket.position.y = Math.sin(Date.now() * 0.002) * 0.5;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* =========================================
           CORE LOGIC & UI
           ========================================= */
        
        // Avatar selection
        document.querySelectorAll('.avatar-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('bg-purple-600/20', 'border-purple-600'));
                const targetBtn = e.currentTarget;
                targetBtn.classList.add('bg-purple-600/20', 'border-purple-600');
                state.user.avatar = targetBtn.getAttribute('data-avatar');
                playClick();
            });
        });

        function startGame() {
            const name = document.getElementById('reg-name').value.trim();
            const cls = document.getElementById('reg-class').value.trim();
            const classno = document.getElementById('reg-classno').value.trim();

            if (!name || !cls || !classno) {
                showWarning("Please fill in all fields to enter the factory!");
                return;
            }

            initAudio();
            playSuccess();

            state.user.name = name;
            state.user.class = cls;
            state.user.classno = classno;

            document.getElementById('modal-register').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            document.getElementById('ui-avatar').innerText = state.user.avatar;
            document.getElementById('ui-name').innerText = state.user.name;
            document.getElementById('ui-class').innerText = state.user.class;
            document.getElementById('ui-classno').innerText = state.user.classno;

            updateLeaderboard();
            renderDashboard();
        }

        function renderDashboard() {
            const grid = document.getElementById('mission-grid');
            grid.innerHTML = '';
            
            missionsData.forEach(m => {
                const isDone = state.completed[m.id];
                const score = state.scores[m.id];
                
                const card = document.createElement('div');
                card.className = `glass-gold rounded-2xl p-6 transition transform anim-float cursor-pointer relative overflow-hidden group ${isDone ? 'border-4 border-green-500' : 'hover:brightness-110'}`;
                card.onclick = () => openMission(m.id);
                card.onmouseenter = playHover;

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="text-4xl filter drop-shadow-md">${m.icon}</div>
                        <div class="text-right">
                            <span class="text-xs font-bold px-2 py-1 rounded-full ${isDone ? 'bg-green-500 text-white' : 'bg-black/20 text-gray-800'}">
                                ${isDone ? 'DONE <i class="fa-solid fa-check"></i>' : 'PENDING'}
                            </span>
                            <div class="mt-2 font-black text-xl text-black">${score} <span class="text-sm font-normal opacity-70">/ ${m.max}</span></div>
                        </div>
                    </div>
                    <div class="text-xs font-bold text-purple-900 uppercase tracking-widest mb-1 relative z-10">${m.num}</div>
                    <h3 class="text-xl font-bold mb-2 relative z-10 text-black">${m.title}</h3>
                    <p class="text-sm relative z-10 text-gray-800">${m.desc}</p>
                    ${isDone ? '<div class="absolute -right-4 -bottom-4 text-8xl opacity-10"><i class="fa-solid fa-medal"></i></div>' : ''}
                `;
                grid.appendChild(card);
            });
            updateTotalScore();
        }

        function updateTotalScore() {
            const total = Object.values(state.scores).reduce((a, b) => a + b, 0);
            document.getElementById('ui-score').innerText = total;
            
            if (total === 39 && !window.wonTriggered) {
                window.wonTriggered = true;
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                playSuccess();
                setTimeout(() => {
                    showWarning(`Congratulations ${state.user.name}! You scored a perfect 39/39 and inherited the factory!`);
                }, 1000);
            }
        }

        function updateLeaderboard() {
            let lb = JSON.parse(localStorage.getItem('wonka-leaderboard') || '[]');
            // Update current user
            const existing = lb.find(x => x.name === state.user.name && x.class === state.user.class);
            const totalScore = Object.values(state.scores).reduce((a, b) => a + b, 0);
            if (existing) { existing.score = totalScore; } 
            else { lb.push({ ...state.user, score: totalScore }); }
            
            lb.sort((a, b) => b.score - a.score);
            lb = lb.slice(0, 3);
            localStorage.setItem('wonka-leaderboard', JSON.stringify(lb));

            const lbContainer = document.getElementById('leaderboard-list');
            lbContainer.innerHTML = lb.map((u, i) => `
                <div class="flex items-center gap-2 mb-1">
                    <span class="opacity-50 text-[10px]">${i+1}.</span>
                    <span class="truncate w-24 text-white">${u.name}</span>
                    <span class="text-yellow-400 font-bold">${u.score}</span>
                </div>
            `).join('');
        }

        /* =========================================
           MISSION RENDERERS & LOGIC
           ========================================= */
        function openMission(id) {
            playClick();
            activeMission = id;
            const m = missionsData.find(x => x.id === id);
            document.getElementById('mission-icon').innerText = m.icon;
            document.getElementById('mission-num').innerText = m.num;
            document.getElementById('mission-title').innerText = m.title;
            document.getElementById('mission-desc').innerText = m.desc;
            
            // Hide all containers
            ['m1','m2','m3','m4','m5','m6'].forEach(mid => {
                const el = document.getElementById(`container-${mid}`);

            const draggedEl = document.getElementById(m1DraggedId);
            const slotEl = document.getElementById(`m1-slot-${index}`);
            
            // If slot already occupied, move existing item back to pool
            if (m1Slots[index] !== null && m1Slots[index] !== name) {
                const existingName = m1Slots[index];
                const existingEl = document.getElementById(`m1-drag-${existingName}`);
                document.getElementById('m1-pool').appendChild(existingEl);
            }

            // Remove from previous slot state if it was in one
            const oldIndex = m1Slots.indexOf(name);
            if(oldIndex !== -1) m1Slots[oldIndex] = null;
            
            // Add to new slot
            m1Slots[index] = name;
            slotEl.appendChild(draggedEl);
            playClick();

            m4DraggedEl = e.currentTarget;
            e.dataTransfer.setData('text/plain', m4DraggedEl.getAttribute('data-id'));
            e.dataTransfer.effectAllowed = 'move';
            
            setTimeout(() => {
                if (m4DraggedEl) {
                    m4DraggedEl.classList.add('opacity-40', 'scale-[0.98]', 'ring-4', 'ring-yellow-400', 'border-yellow-500', 'bg-yellow-50');
                }
            }, 0);
        }

        function m4DragOver(e) {
            if (state.completed.m4) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function m4DragEnter(e) {
            if (state.completed.m4) return;
            e.preventDefault();
            const slot = e.currentTarget.closest('.m4-slot');
            if (slot && !slot.contains(m4DraggedEl)) {
                slot.querySelector('.m4-card')?.classList.add('border-purple-500', 'bg-purple-50', 'scale-[1.02]', 'shadow-xl');
            }
        }

        function m4DragLeave(e) {
            if (state.completed.m4) return;
            const slot = e.currentTarget.closest('.m4-slot');
            if (slot) {
                slot.querySelector('.m4-card')?.classList.remove('border-purple-500', 'bg-purple-50', 'scale-[1.02]', 'shadow-xl');
            }
        }

        function m4Drop(e) {
            if (state.completed.m4) return;
            e.preventDefault();
            
            const targetSlot = e.currentTarget.closest('.m4-slot');
            if (!targetSlot || !m4DraggedEl) return;

            const allSlots = Array.from(document.querySelectorAll('.m4-slot'));
            const allCards = Array.from(document.querySelectorAll('.m4-card'));

            const sourceSlot = m4DraggedEl.closest('.m4-slot');
            const draggedIdx = allSlots.indexOf(sourceSlot);
            const targetIdx = allSlots.indexOf(targetSlot);

            allCards.forEach(c => c.classList.remove('border-purple-500', 'bg-purple-50', 'scale-[1.02]', 'shadow-xl'));

            if (draggedIdx !== -1 && targetIdx !== -1 && draggedIdx !== targetIdx) {
                allCards.splice(draggedIdx, 1);
                allCards.splice(targetIdx, 0, m4DraggedEl);

                allSlots.forEach((slot, i) => {
                    slot.appendChild(allCards[i]);
                });
                playClick();
            }
        }

        function m4DragEnd(e) {
            if (m4DraggedEl) {
                m4DraggedEl.classList.remove('opacity-40', 'scale-[0.98]', 'ring-4', 'ring-yellow-400', 'border-yellow-500', 'bg-yellow-50');
                m4DraggedEl = null;
            }
            document.querySelectorAll('.m4-card').forEach(el => {
                el.classList.remove('border-purple-500', 'bg-purple-50', 'scale-[1.02]', 'shadow-xl');
            });
        }

        function submitM4() {
            if (state.completed.m4) return;
            
            // Check for blanks in Part B
            const selects = ['m4-q1', 'm4-q2', 'm4-q3', 'm4-q4'];
            for (let id of selects) {
                if (!document.getElementById(id).value) {
                    showWarning("Please answer all vocabulary questions before submitting!");
                    return;
                }
            }

            let score = 0;
            // Check Part A
            const rows = document.querySelectorAll('.m4-card');
            let aCorrect = true;
            rows.forEach((r, i) => {
                if(parseInt(r.getAttribute('data-id')) === i + 1) {
                    score++;
                    r.classList.add('border-green-500', 'bg-green-50');
                } else {
                    r.classList.add('border-red-500', 'bg-red-50');
                    aCorrect = false;
                }
            });

            // Check Part B
            const check = (id, ans) => {
                const el = document.getElementById(id);
                if (el.value === ans) {
                    score++;
                    el.classList.add('border-green-500', 'bg-green-100');
                } else {
                    el.classList.add('border-red-500', 'bg-red-100');
                }
            };
            check('m4-q1', 'Trash / Garbage');
            check('m4-q2', 'Squirrels');
            check('m4-q3', 'Chocolate bar');
            check('m4-q4', 'Veruca Salt');

            saveScore('m4', score);
        }

        // ================= MISSION 5 =================
        function renderM5(container) {
            container.innerHTML = `
                <div class="bg-white/90 p-6 rounded-2xl shadow-inner text-black mb-6">
                    <h4 class="font-bold text-lg mb-4">Who is your favorite character in Charlie and the Chocolate Factory? Why do you like them?</h4>
                    <textarea id="m5-essay-input" rows="4" class="w-full border-2 border-purple-200 rounded-xl p-4 focus:outline-none focus:border-yellow-500 text-lg shadow-inner" placeholder="My favorite character is..."></textarea>
                    
                    <div id="m5-feedback-container" class="mt-4 hidden space-y-3">

                    </div>
                </div>
                <button id="m5-submit-btn" onclick="submitM5()" class="submit-btn w-full py-4 bg-gradient-to-r from-green-400 to-green-600 text-white font-bold text-xl rounded-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">Analyze & Submit</button>
            `;
        }

        async function submitM5() {
            if (state.completed.m5) return;
            const textInput = document.getElementById('m5-essay-input');
            const text = textInput ? textInput.value.trim() : '';
            const container = document.getElementById('m5-feedback-container');
            const praiseText = document.getElementById('m5-praise-text');
            const correctionBox = document.getElementById('m5-correction-box');
            const submitBtn = document.getElementById('m5-submit-btn') || document.querySelector('#container-m5 .submit-btn');

            if (!text || text.length < 5) {
                showWarning("Please write your answer about your favorite character!");
                return;
            }

            // Show loading state while AI marks the essay
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles fa-spin mr-2"></i> Teacher is checking your writing...`;
            }

            let resultScore = 3;
            let isMeaningful = true;
            let resultPraise = "";
            let spellingCorrections = [];
            let grammarCorrections = [];
            let contentTips = [];

            try {
                const systemPrompt = `You are a firm, helpful, and constructive Primary 3 (P3, age 8-9 ESL) English teacher marking student writing about "Charlie and the Chocolate Factory".
Prompt: "Who is your favorite character in Charlie and the Chocolate Factory? Why do you like them?"

EVALUATION RULES:
1. GIBBERISH / NONSENSE CHECK: If the text is random letters, keyboard mashing, unreadable garbage (e.g. "dsd ss. dsds ds d/."), set isMeaningful=false and score=0. Do NOT praise garbage text. Politely state that the writing is unreadable.
2. SPELLING CORRECTIONS: Identify any misspelled words explicitly (e.g., "'choklate' should be 'chocolate'").
3. GRAMMAR CORRECTIONS: Identify grammar, capitalization, and punctuation mistakes (e.g., "Capitalize 'charlie' to 'Charlie'", "Add full stop at end").
4. CONTENT FEEDBACK: Evaluate if they named a character and gave a clear reason why. Give specific advice on how to improve or extend their answer.
5. NO OVER-PRAISING: Be honest and clear. Only give high scores (3) for well-formed sentences with clear reasons and proper mechanics.`;

                const userQuery = `Student Name: ${state.user.name || 'Student'}\nStudent Input: "${text}"`;
                const apiKey = "AQ.Ab8RN6Kw0DQV7066qNzeou03oO_jFjeiC6T1rLy4wbX2Ac2xuA";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "score": { "type": "INTEGER", "description": "Score from 0 to 3" },
                                "isMeaningful": { "type": "BOOLEAN", "description": "False if input is nonsense/gibberish, True if real English attempt" },
                                "praise": { "type": "STRING", "description": "Honest, constructive teacher feedback summary" },
                                "spellingCorrections": {
                                    "type": "ARRAY",
                                    "items": { "type": "STRING" },
                                    "description": "Specific spelling fixes"
                                },
                                "grammarCorrections": {
                                    "type": "ARRAY",
                                    "items": { "type": "STRING" },
                                    "description": "Specific grammar/punctuation fixes"
                                },
                                "contentTips": {
                                    "type": "ARRAY",
                                    "items": { "type": "STRING" },
                                    "description": "Advice to expand or improve ideas"
                                }
                            },
                            required: ["score", "isMeaningful", "praise", "spellingCorrections", "grammarCorrections", "contentTips"]
                        }
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    const candidate = data.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        const parsed = JSON.parse(candidate.content.parts[0].text);
                        resultScore = Math.min(3, Math.max(0, parseInt(parsed.score) ?? 1));
                        isMeaningful = parsed.isMeaningful !== false;
                        resultPraise = parsed.praise || "Here is feedback on your writing.";
                        spellingCorrections = Array.isArray(parsed.spellingCorrections) ? parsed.spellingCorrections : [];
                        grammarCorrections = Array.isArray(parsed.grammarCorrections) ? parsed.grammarCorrections : [];
                        contentTips = Array.isArray(parsed.contentTips) ? parsed.contentTips : [];
                    }
                } else {
                    throw new Error("API error");
                }
            } catch (err) {
                console.warn("AI fallback evaluation active:", err);
                
                // Enhanced Heuristic Local Fallback
                const cleanText = text.replace(/[^a-zA-Z]/g, '');
                const vowels = (cleanText.match(/[aeiouyAEIOUY]/g) || []).length;
                const vowelRatio = cleanText.length > 0 ? vowels / cleanText.length : 0;
                
                // Gibberish check: low vowel ratio or short non-words
                if (vowelRatio < 0.20 || cleanText.length < 4) {
                    isMeaningful = false;
                    resultScore = 0;
                    resultPraise = "We could not understand your sentence. Please type real English words!";
                    contentTips.push("Try writing: 'My favorite character is Charlie because he is kind.'");
                } else {
                    let score = 3;
                    if (text[0] !== text[0].toUpperCase()) {
                        grammarCorrections.push("Start your sentence with a CAPITAL letter.");
                        score -= 0.5;
                    }
                    if (!['.', '!', '?'].includes(text[text.length - 1])) {
                        grammarCorrections.push("End your sentence with a full stop (.) or exclamation mark (!).");
                        score -= 0.5;
                    }
                    const names = ['Charlie', 'Wonka', 'Veruca', 'Violet', 'Augustus', 'Mike'];
                    let mentioned = false;
                    names.forEach(n => {
                        if (text.toLowerCase().includes(n.toLowerCase())) {
                            mentioned = true;
                            if (!text.includes(n)) {
                                grammarCorrections.push(`Capitalize character names like "${n}".`);
                                score -= 0.5;
                            }
                        }
                    });
                    if (!mentioned) {
                        contentTips.push("Mention a specific character (e.g. Charlie, Willy Wonka, Veruca, Violet, Augustus, Mike).");
                        score -= 0.5;
                    }
                    if (!text.toLowerCase().includes('because') && !text.toLowerCase().includes('like') && !text.toLowerCase().includes('is')) {
                        contentTips.push("Explain WHY you like them using 'because...'");
                        score -= 0.5;
                    }

                    resultScore = Math.max(1, Math.round(score));
                    resultPraise = resultScore === 3 ? "Great job writing about your favorite character!" : "Good attempt! Here are ways to fix and improve your response:";
                }
            }

            // Display Feedback UI
            container.classList.remove('hidden');
            
            if (!isMeaningful || resultScore === 0) {
                praiseText.className = "p-4 rounded-xl font-bold text-sm bg-red-100 text-red-900 border-2 border-red-500 flex items-center gap-3";
                praiseText.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600 text-2xl shrink-0"></i> <span>${resultPraise}</span>`;
            } else if (resultScore === 3 && spellingCorrections.length === 0 && grammarCorrections.length === 0) {
                praiseText.className = "p-4 rounded-xl font-bold text-sm bg-green-100 text-green-900 border-2 border-green-500 flex items-center gap-3";
                praiseText.innerHTML = `<i class="fa-solid fa-circle-check text-green-600 text-2xl shrink-0"></i> <span>${resultPraise}</span>`;
            } else {
                praiseText.className = "p-4 rounded-xl font-bold text-sm bg-amber-100 text-amber-900 border-2 border-amber-500 flex items-center gap-3";
                praiseText.innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-600 text-2xl shrink-0"></i> <span>${resultPraise}</span>`;
            }

            let correctionHTML = '';
            if (spellingCorrections.length > 0) {
                correctionHTML += `
                    <div class="bg-red-50 border-2 border-red-300 p-3 rounded-xl text-red-950">
                        <div class="font-bold text-xs uppercase tracking-wider text-red-700 mb-1 flex items-center gap-2">
                            <i class="fa-solid fa-spell-check"></i> Spelling Fixes
                        </div>
                        <ul class="list-disc list-inside text-xs sm:text-sm font-semibold space-y-1">
                            ${spellingCorrections.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (grammarCorrections.length > 0) {
                correctionHTML += `
                    <div class="bg-purple-50 border-2 border-purple-300 p-3 rounded-xl text-purple-950">
                        <div class="font-bold text-xs uppercase tracking-wider text-purple-700 mb-1 flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Grammar & Mechanics
                        </div>
                        <ul class="list-disc list-inside text-xs sm:text-sm font-semibold space-y-1">
                            ${grammarCorrections.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (contentTips.length > 0) {
                correctionHTML += `
                    <div class="bg-yellow-50 border-2 border-yellow-300 p-3 rounded-xl text-yellow-950">
                        <div class="font-bold text-xs uppercase tracking-wider text-yellow-700 mb-1 flex items-center gap-2">
                            <i class="fa-solid fa-lightbulb"></i> How to Improve Your Answer
                        </div>
                        <ul class="list-disc list-inside text-xs sm:text-sm font-semibold space-y-1">
                            ${contentTips.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            if (correctionHTML) {
                correctionBox.innerHTML = correctionHTML;
                correctionBox.classList.remove('hidden');
            } else {
                correctionBox.classList.add('hidden');
            }

            saveScore('m5', resultScore);
        }

        // ================= MISSION 6 =================
        let m6Stream = null;
        let m6Recorder = null;
        let m6Chunks = [];
        let m6SongAudio = null;

        function renderM6(container) {
            container.innerHTML = `
                <div class="bg-white/90 p-6 rounded-2xl shadow-inner text-black flex flex-col items-center">
                    <h4 class="font-bold text-xl mb-4 text-purple-900">Charlie's Song</h4>
                    
                    <div class="bg-purple-50 p-6 rounded-xl border border-purple-100 w-full text-center font-serif text-base sm:text-lg leading-relaxed mb-6">
                        "Charlie and his family<br>
                        Didn't have lots of money,<br>
                        But he found a Golden Ticket,<br>
                        And he went to the chocolate factory!<br><br>
                        <span class="font-bold text-purple-700 not-italic">Charlie, Charlie, what did you see<br>
                        In Mr. Wonka's factory?<br>
                        Charlie, Charlie, what did you do<br>
                        When Mr. Wonka gave the factory to you?</span><br><br>
                        The other children were naughty—<br>
                        Violet, Augustus, Veruca, and Mike.<br>
                        Mr. Wonka did not like them.<br>
                        Charlie was the one he liked!"
                    </div>

                    <div class="flex flex-wrap justify-center gap-4 w-full">
                        <button id="m6-btn-listen" onclick="m6Listen()" class="flex-1 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-headphones"></i> Listen Aloud
                        </button>
                        <button id="m6-btn-rec" onclick="m6Record()" class="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-microphone"></i> Start Recording
                        </button>
                        <button id="m6-btn-stop" onclick="m6StopRec()" class="flex-1 py-3 bg-gray-400 text-white rounded-xl font-bold shadow transition hidden flex items-center justify-center gap-2">
                            <i class="fa-solid fa-stop"></i> Stop
                        </button>
                    </div>

                    <div id="m6-audio-container" class="mt-6 w-full hidden flex flex-col items-center">
                        <p class="text-sm font-bold text-green-600 mb-2">Great job! You earned 1 point.</p>
                        <audio id="m6-player" controls class="w-full max-w-sm"></audio>
                    </div>
                </div>
            `;
        }

        function m6Listen() {
            playClick();
            const btn = document.getElementById('m6-btn-listen');
            
            if (!m6SongAudio) {
                m6SongAudio = new Audio('song.mp3');
                m6SongAudio.onended = () => {
                    if (btn) btn.innerHTML = `<i class="fa-solid fa-headphones"></i> Listen Aloud`;
                };
            }

            if (m6SongAudio.paused) {
                m6SongAudio.play().then(() => {
                    if (btn) btn.innerHTML = `<i class="fa-solid fa-pause"></i> Pause Song`;
                }).catch(err => {
                    showWarning("Could not play 'song.mp3'. Please ensure 'song.mp3' is saved in the same folder as this HTML file.");
                    if (btn) btn.innerHTML = `<i class="fa-solid fa-headphones"></i> Listen Aloud`;
                });
            } else {
                m6SongAudio.pause();
                if (btn) btn.innerHTML = `<i class="fa-solid fa-headphones"></i> Listen Aloud`;
            }
        }

        async function m6Record() {
            if (state.completed.m6) return;
            playClick();
            try {
                m6Stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                m6Recorder = new MediaRecorder(m6Stream);
                m6Chunks = [];
                
                m6Recorder.ondataavailable = e => m6Chunks.push(e.data);
                m6Recorder.onstop = () => {
                    const blob = new Blob(m6Chunks, { type: 'audio/ogg; codecs=opus' });
                    const url = URL.createObjectURL(blob);
                    document.getElementById('m6-player').src = url;
                    document.getElementById('m6-audio-container').classList.remove('hidden');
                    saveScore('m6', 1);
                };

                m6Recorder.start();
                document.getElementById('m6-btn-rec').classList.add('hidden');
                document.getElementById('m6-btn-stop').classList.remove('hidden');
                document.getElementById('m6-btn-stop').classList.add('animate-pulse', 'bg-gray-800');
            } catch(e) {
                showWarning("Microphone access denied or not available.");
            }
        }

        function m6StopRec() {
            playClick();
            if(m6Recorder && m6Recorder.state === "recording") {
                m6Recorder.stop();
                m6Stream.getTracks().forEach(track => track.stop());
                
                document.getElementById('m6-btn-stop').classList.add('hidden');
                document.getElementById('m6-btn-rec').classList.remove('hidden');
                document.getElementById('m6-btn-rec').innerText = "Record Again";
            }
        }

        /* =========================================
           HELPERS
           ========================================= */
        function saveScore(missionId, score) {
            if (score > 0) playSuccess();
            else playError();
            
            state.scores[missionId] = score;
            state.completed[missionId] = true;
            updateTotalScore();
            
            const container = document.getElementById(`container-${missionId}`);
            const mData = missionsData.find(m => m.id === missionId);
            
            // Update Submit Button visually to show locked state and score
            const submitBtn = container.querySelector('.submit-btn');
            if (submitBtn) {
                submitBtn.innerHTML = `<i class="fa-solid fa-check"></i> Mission Completed! Score: ${score} / ${mData.max}`;
                submitBtn.className = "submit-btn w-full py-4 bg-gray-500 text-white font-bold text-xl rounded-xl shadow-inner cursor-not-allowed mt-4";
                submitBtn.disabled = true;
                submitBtn.onclick = null;
            }

            // Lock all inputs so user cannot edit
            const inputs = container.querySelectorAll('input, select, textarea');
            inputs.forEach(inp => {
                inp.disabled = true;
                inp.classList.add('opacity-80', 'cursor-not-allowed');
            });

            // Specific mission lock behaviors
            if (missionId === 'm1') {
                const dragItems = container.querySelectorAll('[draggable]');
                dragItems.forEach(el => {
                    el.setAttribute('draggable', 'false');
                    el.classList.remove('cursor-grab', 'active:cursor-grabbing');
                    el.classList.add('cursor-not-allowed');
                });
                const resetBtn = container.querySelector('button[onclick="m1Clear()"]');
                if (resetBtn) resetBtn.style.display = 'none';
            }
            
            if (missionId === 'm4') {
                const dragItems = container.querySelectorAll('.m4-card[draggable]');
                dragItems.forEach(el => {
                    el.setAttribute('draggable', 'false');
                    el.classList.remove('cursor-grab', 'active:cursor-grabbing', 'hover:scale-[1.01]');
                    el.classList.add('cursor-not-allowed');
                });
            }
            
            if (missionId === 'm6') {
                const recBtn = document.getElementById('m6-btn-rec');
                if(recBtn) recBtn.style.display = 'none';
            }

            // Notice we purposefully DO NOT call closeMission() here. 
            // The student stays on the page to review the answers and feedback.
        }

        window.onload = () => {
            initThreeJS();
        };
    </script>
